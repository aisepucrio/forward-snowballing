<div class="filter-wrapper">
  <div class="filter-dropdown">
    <i class="bi bi-filter"></i>
    <span>Filter By</span>
    <select id="status" name="status">
      <option value="">Todos</option>
      <option value="year-range">Year Range</option>
      <option value="venue">Venue</option>
      <option value="author">Author</option>
      <option value="citation-count">Citation Count</option>
      <option value="keyword">Keyword</option> 
    </select>
  </div>

  <!-- Year Range Filter-->
  <div id="decadeSubMenu" class="submenu hidden">
    <div class="decade-buttons">
      <button type="button" class="btn-decade" data-start="2000" data-end="2004">2000 - 2004</button>
      <button type="button" class="btn-decade" data-start="2005" data-end="2009">2005 - 2009</button>
      <button type="button" class="btn-decade" data-start="2010" data-end="2014">2010 - 2014</button>
      <button type="button" class="btn-decade" data-start="2015" data-end="2019">2015 - 2019</button>
      <button type="button" class="btn-decade" data-start="2020" data-end="2024">2020 - 2024</button>
      <button type="button" class="btn-decade" data-start="2025" data-end="2029">2025 - 2029</button>
    </div>
  </div>
  
  <!-- Author Filter -->
  <div id="authorSubMenu" class="submenu hidden">
    <div class="author-list"></div>
  </div>

  <!-- Venue Filter -->
  <div id="venueSubMenu" class="submenu hidden">
    <div class="venue-list"></div>
  </div>




</div>
