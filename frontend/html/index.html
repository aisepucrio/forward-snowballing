<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>SnowMap</title>
  <link rel="icon" href="../images/favicon-32x32.png" type="image/x-icon">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles_index.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="components/table/table.css" />
  <link rel="stylesheet" href="components/filter/filter.css" />
</head>

<body>
  <div id="navbar-component"></div>
  <link rel="stylesheet" href="components/navbar/navbar.css" />
  <script src="components/navbar/navbar.js"></script>

  <main class="container-fluid px-4">
    <div id="headerContainer" class="text-center mb-4">
      <div class="logotipo mb-10">
        <img src="/images/logo-snowballing.png" alt="Snowballing Logo" style="height: 15%; width: 15%;">
      </div>

      <h1 class="fw-semibold mb-4">SnowMap</h1>
      <p class="text-muted mb-2">The Academic Curator for deep citation mapping and research discovery</p>

      <p class="text-black">Add one or more seed papers by <b>DOI</b> or <b>Title</b></p>
    </div>

    <div id="seedBuilder">
      <form id="searchForm" class="d-flex justify-content-center mb-2" onsubmit="adicionarSeed(); return false;">
        <div class="d-flex align-items-center shadow-sm" style="background:#f1f1f1;border-radius:20px;padding:8px 12px;">
          <div class="btn-group seed-type-toggle me-2" role="group" aria-label="Seed type">
            <input type="radio" class="btn-check" name="seedType" id="seedTypeDoi" value="doi" checked>
            <label class="btn btn-outline-success btn-sm" for="seedTypeDoi">DOI</label>
            <input type="radio" class="btn-check" name="seedType" id="seedTypeTitle" value="title">
            <label class="btn btn-outline-success btn-sm" for="seedTypeTitle">Title</label>
          </div>
          <input type="text" id="searchInput" placeholder="e.g., 10.1145/3025453.3025795" class="form-control border-0 bg-transparent" style="box-shadow:none;" aria-label="Seed DOI or title">
          <button type="submit" id="addSeedBtn" class="btn btn-outline-success ms-2 px-3">
            <i class="bi bi-plus-lg"></i> Add
          </button>
        </div>
      </form>

      <p id="seedError" class="seed-error text-danger text-center small mb-2" role="alert"></p>

      <div id="seedList" class="seed-list" aria-live="polite"></div>

      <div class="d-flex justify-content-center align-items-center gap-3 mb-4">
        <span id="seedCounter" class="seed-counter text-muted small">0/20 seeds</span>
        <button type="button" id="searchSeedsBtn" class="btn btn-success px-4 seed-search-btn" onclick="buscarArtigo()">
          <i class="bi bi-search"></i> Search
        </button>
      </div>
    </div>

    <div id="loadingSpinner" class="my-4" style="display:none;">
      <div class="search-progress" role="status" aria-live="polite">
        <div class="search-progress-head">
          <div class="spinner-border spinner-border-sm text-success" role="presentation"></div>
          <span id="progressStatus" class="search-progress-status">Searching…</span>
          <span id="progressElapsed" class="search-progress-elapsed">0s</span>
        </div>
        <p id="progressHint" class="search-progress-hint">This usually takes under a minute.</p>
      </div>
    </div>

    <div id="resultado" class="mt-4"></div>

    <div id="snowballModeToggle" class="mb-3">
      <div class="btn-group" role="group" aria-label="Snowballing direction">
        <input type="radio" class="btn-check" name="snowballMode" id="modeForward" value="forward" checked>
        <label class="btn btn-outline-success btn-sm px-3" for="modeForward">
          <i class="bi bi-arrow-up-right-circle me-1"></i> Citations
        </label>
        <input type="radio" class="btn-check" name="snowballMode" id="modeBackward" value="backward">
        <label class="btn btn-outline-success btn-sm px-3" for="modeBackward">
          <i class="bi bi-arrow-down-left-circle me-1"></i> References
        </label>
      </div>
    </div>

    <div id="citationsList" class="table-wrapper" style="display:none;">

      <div class="table-topbar">
        <div class="table-info">
          <span class="table-title">Cited By</span>
        </div>

        <div class="table-actions">

          <div id="filterWrapper" class="filter-wrapper"></div>

          
          <button id="dedupBtn" class="btn-export" onclick="openDedupModal()">
            <i class="bi bi-copy"></i>
            See Duplicates
          </button>
          <button id="downloadBtn" class="btn-export">
            <i class="bi bi-download"></i>
            Export
          </button>
          <button id="includeAllBtn" class="btn-export">
            <i class="bi bi-check2-square"></i>
            Include All
          </button>
          <!-- Só aparece quando a busca devolve search_id (banco ligado). -->
          <button id="saveStateBtn" class="btn-export" style="display:none;" disabled>
            <i class="bi bi-cloud-check"></i>
            Save Research State
          </button>
        </div>
      </div>

      <table class="custom-table" id="tabela-triagem">
        <thead>
          <tr>
            <th class="col-identity">Research Identity</th>
            <th class="col-abstract">Abstract</th>
            <th class="col-keywords">Keywords</th>
            <th class="col-citations">Citations</th>
            <th class="col-actions d-none">Actions</th>
          </tr>
        </thead>
        <tbody id="tabelaTriagemBody"></tbody>
      </table>

    </div>
  </main>

  <div id="footer-component"></div>
  <link rel="stylesheet" href="components/footer/footer.css" />
  <script src="components/footer/footer.js"></script>

  <div class="modal fade" id="dedupModal" tabindex="-1" aria-labelledby="dedupModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="dedupModalLabel">Review Duplicates</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="dedupModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="components/table/table.js"></script>
  <script src="components/filter/filter.js"></script>
  <script src="js/index.js"></script>
</body>

</html>
