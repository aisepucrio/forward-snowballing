<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>SnowMap</title>
  <link rel="icon" href="../images/favicon-32x32.png" type="image/x-icon">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles_index.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="navbar-component"></div>
  <link rel="stylesheet" href="components/navbar/navbar.css" />
  <script src="components/navbar/navbar.js"></script>

  <main class="container-fluid px-4">
    <div id="headerContainer" class="text-center mb-4">
      <div class="logotipo mb-10">
        <img src="/images/logo-snowballing.png" alt="Snowballing Logo" style="height: 15%; width: 15%;">
      </div>

      <h1 class="fw-semibold mb-4">SnowMap</h1>
      <p class="text-muted mb-2">The Academic Curator for deep citation mapping and research discovery</p>

      <p class="text-black">Add one or more seed papers by <b>DOI</b> or <b>Title</b></p>
    </div>

    <div id="seedBuilder">
      <form id="searchForm" class="d-flex justify-content-center align-items-center gap-2 mb-2" onsubmit="adicionarSeed(); return false;">
        <div class="d-flex align-items-center shadow-sm" style="background:#f1f1f1;border-radius:20px;padding:8px 12px;">
          <input type="text" id="searchInput" placeholder="DOI or title (e.g., https://doi.org/00.0000)" class="form-control border-0 bg-transparent" style="box-shadow:none;" aria-label="Seed DOI or title">
        </div>
        <button type="submit" id="addSeedBtn" class="btn btn-outline-success" aria-label="Add seed" title="Add seed">
          <i class="bi bi-plus-lg"></i>
        </button>
      </form>

      <p id="seedError" class="seed-error text-danger text-center small mb-2" role="alert"></p>

      <div id="seedList" class="seed-list" aria-live="polite"></div>

      <div class="d-flex justify-content-center align-items-center gap-3 mb-4">
        <span id="seedCounter" class="seed-counter text-muted small">0/20 seeds</span>
        <button type="button" id="searchSeedsBtn" class="btn btn-success px-4 seed-search-btn" onclick="buscarArtigo()">
          <i class="bi bi-search"></i> Search
        </button>
      </div>
    </div>

    <div id="loadingSpinner" class="my-4" style="display:none;">
      <div class="search-progress" role="status" aria-live="polite">
        <div class="search-progress-head">
          <div class="spinner-border spinner-border-sm text-success" role="presentation"></div>
          <span id="progressStatus" class="search-progress-status">Searching…</span>
          <span id="progressElapsed" class="search-progress-elapsed">0s</span>
        </div>
        <p id="progressHint" class="search-progress-hint">This usually takes under a minute.</p>
      </div>
    </div>
  </main>

  <div id="footer-component"></div>
  <link rel="stylesheet" href="components/footer/footer.css" />
  <script src="components/footer/footer.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/searchState.js"></script>
  <script src="js/index.js"></script>
</body>

</html>
